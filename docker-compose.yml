services:
  audio-streamer:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: aposazhennikov/audio-streamer:latest
    container_name: audio-streamer
    ports:
      - "8000:8000"
    volumes:
      - /home/politics:/app/politics
      - /home/humor:/app/humor
      - /home/science:/app/science
      #- /home/floyd/:/app/floyd/
      - /home/nature:/app/nature
      - /home/shaov:/app/shaov
      - /home/troshin:/app/troshin
      - /home/test_audio:/app/test_audio
      - /home/monosov:/app/monosov
      - /home/monosov1:/app/monosov1
      - /home/monosov2:/app/monosov2
      - /home/monosov3:/app/monosov3
      - /home/monosov4:/app/monosov4
      - /home/monosov5:/app/monosov5
      - /home/monosov6:/app/monosov6
      - /home/monosov7:/app/monosov7
      - /home/monosov8:/app/monosov8
      - /home/monosov9:/app/monosov9
      - /home/monosov10:/app/monosov10
      - /home/monosov11:/app/monosov11
      - ./relay_data:/app/relay_data:rw
      - ./state:/app/state:rw
      - ./telegram_alerts.json:/app/telegram_alerts.json:rw
    env_file:
      - .env
    environment:
      - BITRATE=${BITRATE:-128}
      - MAX_CLIENTS=${MAX_CLIENTS:-10}
      - LOG_LEVEL=${LOG_LEVEL:-warning}
      - SHUFFLE=${SHUFFLE:-false}
      - ROUTES_SHUFFLE=${ROUTES_SHUFFLE:-}
      - NORMALIZE_VOLUME=${NORMALIZE_VOLUME:-false}
      - NORMALIZE_RUNTIME=${NORMALIZE_RUNTIME:-off}
      - NORMALIZE_SAMPLE_WINDOWS=${NORMALIZE_SAMPLE_WINDOWS:-0}
      - NORMALIZE_SAMPLE_MS=${NORMALIZE_SAMPLE_MS:-0}
      - STATUS_PASSWORD=${STATUS_PASSWORD:-1234554321}
      - SENTRY_DSN=${SENTRY_DSN:-https://f5dbf565496b75215d81c2286cf0dc9c@o4508953992101888.ingest.de.sentry.io/4509243323908176}
      - RELAY=${RELAY:-false}
      - RELAY_CONFIG_FILE=${RELAY_CONFIG_FILE:-/app/relay_data/relay_list.json}
      - TG_ALERT=${TG_ALERT:-true}
      - TG_ALERT_CONFIG_FILE=${TG_ALERT_CONFIG_FILE:-/app/telegram_alerts.json}
      - TG_ALERT_TIMEZONE=${TG_ALERT_TIMEZONE:-Europe/Moscow}
      # Presets 1 and 2 of the receiver: arriving on them only plays a short sound; pressing
      # the same preset again moves the station listened to one track forward / back.
      # A new connection to the same preset sooner than REMOTE_REPEAT_GAP_SECONDS is never
      # a press. An empty route makes it an ordinary station. The sessions are kept in
      # REMOTE_STATE_FILE, so a restart does not make a button lose its station.
      - REMOTE_NEXT_ROUTE=${REMOTE_NEXT_ROUTE-/shaov}
      - REMOTE_PREV_ROUTE=${REMOTE_PREV_ROUTE-/troshin}
      - REMOTE_REPEAT_GAP_SECONDS=${REMOTE_REPEAT_GAP_SECONDS:-3}
      - REMOTE_STATE_FILE=/app/state/remote_sessions.json
      # The track every station is on, so that after the nightly restart it continues there.
      - STATION_POSITIONS_FILE=/app/state/positions.json
      # Stations that get new files every day are played newest first.
      - NEWEST_FIRST_ROUTES=${NEWEST_FIRST_ROUTES-/politics,/science}
      # A station counts as the one being listened to after this many seconds on it.
      - REMOTE_MIN_LISTEN_SECONDS=${REMOTE_MIN_LISTEN_SECONDS:-15}
      # Spoken announcements (station, record, minutes) for these receivers and for ?voice=1.
      # An empty ANNOUNCE_TTS_URL turns them off.
      - ANNOUNCE_TTS_URL=${ANNOUNCE_TTS_URL-http://tts:5002}
      - ANNOUNCE_USER_AGENTS=${ANNOUNCE_USER_AGENTS:-WR-230SF}
      - ANNOUNCE_CACHE_DIR=/app/state/voice
    sysctls:
      - net.ipv4.tcp_tw_reuse=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    restart: unless-stopped
    # Logs go to the host journald, so they survive the container being recreated.
    logging:
      driver: journald
      options:
        tag: audio-streamer

  # Speech synthesis for the announcements (Piper, Russian voice); only the audio server uses it.
  tts:
    image: aposazhennikov/audio-streamer-tts:latest
    container_name: audio-streamer-tts
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: audio-streamer-tts
