name: CI and Deploy

on:
  push:
    branches: [ '**' ]
  pull_request:
  # Ability to run workflow manually
  workflow_dispatch:

jobs:
  vet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

  unit-tests:
    needs: vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -race -count=1 -timeout 15m ./unit/...

  build-and-push:
    needs: unit-tests
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute version
        id: version
        run: |
          echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/audio-streamer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/audio-streamer:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/audio-streamer:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/audio-streamer:buildcache,mode=max

  deploy:
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a running deploy is never cancelled by a newer push.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        env:
          STATUS_PASSWORD: ${{ secrets.STATUS_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          envs: STATUS_PASSWORD,SENTRY_DSN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            if [ ! -d /home/stream-audio-to-web/.git ]; then
              git clone https://github.com/aposazhennikov/stream-audio-to-web.git /home/stream-audio-to-web
            fi
            cd /home/stream-audio-to-web
            git fetch origin main
            git checkout FETCH_HEAD -- scripts/deploy.sh
            bash scripts/deploy.sh

      # Fallback webhook deploy if SSH fails
      - name: Deploy via webhook (fallback)
        if: failure()
        run: |
          echo "SSH deploy failed, trying webhook method..."
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "aposazhennikov/audio-streamer:latest",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}"
            }' || echo "Webhook deploy also failed"

  # The e2e tests in ./e2e need a live server, so they do not run in CI.
  # scripts/deploy.sh checks every stream route on the server after each deploy.
  # To run them by hand, set TEST_SERVER_URL and STATUS_PASSWORD and run: go test -v ./e2e/...
